<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MIRRA — Entry Kiosk</title>
    <style>
      * { box-sizing: border-box; margin: 0; }
      body {
        font-family: -apple-system, system-ui, sans-serif;
        background: #111; color: #eee;
        display: flex; justify-content: center; align-items: center;
        min-height: 100vh;
      }
      .card {
        background: #1c1c1e; border-radius: 16px; padding: 40px;
        max-width: 640px; width: 92%; text-align: center;
      }
      h1 { font-size: 28px; margin-bottom: 16px; }
      p { line-height: 1.5; color: #aaa; margin-bottom: 12px; }
      button {
        background: #4f7cff; color: white; border: none; border-radius: 10px;
        padding: 14px 32px; font-size: 18px; cursor: pointer; margin-top: 20px;
      }
      button:disabled { background: #333; color: #777; cursor: not-allowed; }
      label.row {
        display: flex; align-items: center; gap: 12px; text-align: left;
        background: #2a2a2d; padding: 14px; border-radius: 10px; margin-top: 12px;
        font-size: 15px; color: #ddd;
      }
      video { width: 100%; border-radius: 12px; margin-top: 16px; background: #000; }
      .ok { color: #4cd964; font-size: 48px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
