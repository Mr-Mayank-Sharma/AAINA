<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MIRRA — Retailer Admin</title>
    <style>
      * { box-sizing: border-box; margin: 0; }
      body { font-family: -apple-system, system-ui, sans-serif; background: #f5f5f7; color: #1d1d1f; }
      header { background: #fff; padding: 14px 24px; display: flex; gap: 20px; align-items: center; border-bottom: 1px solid #e5e5ea; }
      header h1 { font-size: 18px; }
      nav button { background: none; border: none; font-size: 15px; cursor: pointer; padding: 8px 12px; color: #666; }
      nav button.active { color: #4f7cff; font-weight: 600; }
      main { padding: 24px; max-width: 1100px; margin: 0 auto; }
      .card { background: #fff; border-radius: 12px; padding: 20px; margin-bottom: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
      table { width: 100%; border-collapse: collapse; font-size: 14px; }
      th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid #eee; }
      .badge { padding: 2px 10px; border-radius: 999px; font-size: 12px; }
      .badge.passed { background: #d4f4dd; color: #1a7f37; }
      .badge.flagged { background: #ffe2e2; color: #c0392b; }
      .badge.pending { background: #fff3cd; color: #856404; }
      input, textarea { padding: 8px; border: 1px solid #ccc; border-radius: 8px; font-size: 14px; width: 100%; }
      button.primary { background: #4f7cff; color: white; border: none; border-radius: 8px; padding: 10px 18px; cursor: pointer; }
      .stat { font-size: 32px; font-weight: 700; }
      .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; }
      label { font-size: 13px; color: #666; display: block; margin-bottom: 4px; }
      .field { margin-bottom: 12px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
