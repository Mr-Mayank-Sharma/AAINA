version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: mirra-postgres
    environment:
      POSTGRES_USER: mirra
      POSTGRES_PASSWORD: mirra_dev_password
      POSTGRES_DB: mirra
    ports:
      - "5432:5432"
    volumes:
      - mirra_pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mirra -d mirra"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: mirra-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - mirra_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: mirra-minio
    environment:
      MINIO_ROOT_USER: mirra
      MINIO_ROOT_PASSWORD: mirra_dev_secret
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    volumes:
      - mirra_miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot bucket creator for local dev
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 mirra mirra_dev_secret &&
      mc mb --ignore-existing local/mirra-garment-images &&
      mc mb --ignore-existing local/mirra-render-outputs &&
      echo 'Buckets ready.'
      "

volumes:
  mirra_pgdata:
  mirra_redisdata:
  mirra_miniodata:
